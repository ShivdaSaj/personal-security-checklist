# Generated by dashboard/make-compose.mjs. Edit the generator, not this file.
services:
  builder:
    image: node:22-alpine
    restart: "no"
    environment:
      CONTENT_REPO: https://raw.githubusercontent.com/ShivdaSaj/personal-security-checklist/master
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        {
          set -e
          mkdir -p /work/dashboard /work/web/src/components/core
          cd /work/dashboard
          base64 -d /bundle.b64 > /tmp/bundle.txz
          echo "e051dcc57f1d3e350a9ed719c3d05f51568e9454505a9424dd2d7e6f55a9044c  /tmp/bundle.txz" | sha256sum -c -
          tar xJf /tmp/bundle.txz
          npm ci --omit=dev --no-audit --no-fund --loglevel=error
          wget -qO /work/personal-security-checklist.yml "$$CONTENT_REPO/personal-security-checklist.yml"
          wget -qO /work/web/src/components/core/icon.tsx "$$CONTENT_REPO/web/src/components/core/icon.tsx" || true
          node build.mjs
          rm -rf /out/* && cp -r dist/. /out/ && chmod -R a+rX /out
        } || test -f /out/index.html
    configs:
      - source: app_bundle
        target: /bundle.b64
    volumes:
      - site:/out

  defense-console:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    volumes:
      - site:/usr/share/nginx/html:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
    labels:
      - traefik.enable=true
      - traefik.http.routers.defense-console.rule=Host(`personal-checklist.sajinshivdas.online`)
      - traefik.http.routers.defense-console.entrypoints=websecure
      - traefik.http.routers.defense-console.tls=true
      - traefik.http.routers.defense-console.tls.certresolver=letsencrypt
      - traefik.http.services.defense-console.loadbalancer.server.port=8080

volumes:
  site:

configs:
  nginx_conf:
    content: |
      map $$uri $$cache_control {
        ~*\.(css|js|svg)$$  "public, max-age=3600";
        default            "no-cache";
      }
      
      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
      
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 512;
      
        add_header Cache-Control $$cache_control always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
      
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location / { try_files $$uri $$uri/ /index.html; }
      }
